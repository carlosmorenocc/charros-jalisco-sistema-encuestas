openapi: 3.0.0
info:
  title: Encuesta Oficial Charros - Submit API
  version: 1.4.0
  description: API HTTP para recibir respuestas de encuestas y registros de Charros de Jalisco.

servers:
  - url: https://tu-api.onrender.com

paths:
  /healthz:
    get:
      summary: Estado de la API
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  status:
                    type: string
                  queueSize:
                    type: integer
                  publicFormsEnabled:
                    type: boolean
                  subscriberFormEnabled:
                    type: boolean
                  rewardsFormEnabled:
                    type: boolean
                  softballFormEnabled:
                    type: boolean
                  softballRegistrationOpen:
                    type: boolean
                  softballRegistrationDeadline:
                    type: string
                    format: date-time

  /api/submit:
    post:
      summary: Recibe una respuesta de la encuesta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timestamp:
                  type: string
                  format: date-time
                submissionId:
                  type: string
                campaignName:
                  type: string
                source:
                  type: string
                nombre:
                  type: string
                apellido:
                  type: string
                email:
                  type: string
                  format: email
                telefono:
                  type: string
                myCashlessId:
                  type: string
                rangoEdad:
                  type: string
                sexo:
                  type: string
                municipio:
                  type: string
                relacionCharros:
                  type: string
                antiguedad:
                  type: string
                acompanantes:
                  type: string
                motivacion:
                  type: string
                calificacionExperiencia:
                  type: string
                aspectosDisfrutados:
                  type: array
                  items:
                    type: string
                aspectosDisfrutadosOtro:
                  type: string
                aspectosMejorar:
                  type: string
                comentarioExperiencia:
                  type: string
                facilidadMyCashless:
                  type: string
                comentarioMyCashless:
                  type: string
                consumoEstadio:
                  type: string
                interesClubCharros:
                  type: string
                razonNoRenovo:
                  type: string
                beneficioPreferido:
                  type: array
                  items:
                    type: string
                canalPromociones:
                  type: array
                  items:
                    type: string
                tipoInformacion:
                  type: array
                  items:
                    type: string
                comentario:
                  type: string
                aceptaAvisoPrivacidad:
                  type: boolean
                aceptaComunicaciones:
                  type: boolean
              required:
                - nombre
                - apellido
                - email
      responses:
        '202':
          description: Respuesta encolada para persistencia
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  stored:
                    type: boolean
                  queued:
                    type: boolean
        '400':
          description: Faltan campos requeridos
        '503':
          description: Cola saturada, intenta de nuevo

  /api/submissions.csv:
    get:
      summary: Descarga protegida de respuestas en CSV
      security:
        - csvExportToken: []
      responses:
        '200':
          description: Archivo CSV con respuestas
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Token ausente o incorrecto
        '503':
          description: Exportación deshabilitada porque CSV_EXPORT_TOKEN no está configurado

  /api/lead-submit:
    post:
      summary: Registra un lead de estadio (solo 1 por correo al día)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                timestamp:
                  type: string
                  format: date-time
                submissionId:
                  type: string
                campaignName:
                  type: string
                source:
                  type: string
                nombre:
                  type: string
                apellido:
                  type: string
                email:
                  type: string
                  format: email
                telefono:
                  type: string
                municipio:
                  type: string
                frecuenciaVisita:
                  type: string
                aceptaAvisoPrivacidad:
                  type: boolean
                aceptaComunicaciones:
                  type: boolean
                aceptaRegistroDiario:
                  type: boolean
              required:
                - nombre
                - apellido
                - email
                - telefono
                - municipio
                - frecuenciaVisita
                - aceptaAvisoPrivacidad
                - aceptaRegistroDiario
      responses:
        '202':
          description: Lead encolado para persistencia
        '400':
          description: Faltan campos requeridos
        '409':
          description: El correo ya registró un lead hoy
        '503':
          description: Cola saturada, intenta de nuevo

  /api/leads-submissions.csv:
    get:
      summary: Descarga protegida de leads en CSV
      security:
        - csvExportToken: []
      responses:
        '200':
          description: Archivo CSV con leads de estadio
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Token ausente o incorrecto
        '503':
          description: Exportación deshabilitada porque CSV_EXPORT_TOKEN no está configurado

  /api/abonados-lmp-submit:
    post:
      summary: Registra beneficios, personalización y entrega de abonos LMP 2026-2027
      description: >-
        El servidor genera submissionId, timestamp, campaignName, source,
        privacyNoticeVersion y consentTimestamp. Solo se permite un registro por
        correo normalizado en esta campaña. cantidadAbonos debe coincidir exactamente
        con la longitud de unidadesAbono.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nombre:
                  type: string
                  minLength: 2
                  maxLength: 100
                apellido:
                  type: string
                  minLength: 2
                  maxLength: 100
                email:
                  type: string
                  format: email
                  maxLength: 254
                telefono:
                  type: string
                  maxLength: 32
                cantidadAbonos:
                  type: integer
                  minimum: 1
                  maximum: 20
                unidadesAbono:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    additionalProperties: false
                    required: [zona, tallaJersey, personalizacionTexto, personalizacionNumero]
                    properties:
                      zona:
                        type: string
                        enum: [VIP, PREFERENTE, GENERAL]
                      tallaJersey:
                        type: string
                        description: Obligatoria para VIP/Preferente y vacía para General.
                      personalizacionTexto:
                        type: string
                        pattern: '^(?=.*[A-ZÁÉÍÓÚÜÑ])[A-ZÁÉÍÓÚÜÑ ]{1,10}$'
                      personalizacionNumero:
                        type: string
                        pattern: '^\d{1,2}$'
                boletoMovilLigado:
                  type: string
                  enum: [SI, 'NO']
                boletoMovilId:
                  type: string
                  pattern: '^\d{1,20}$'
                preferenciaEntrega:
                  type: string
                  enum: [APP_BOLETOMOVIL, PDF]
                aceptaAvisoPrivacidad:
                  type: boolean
                  enum: [true]
                aceptaComunicaciones:
                  type: boolean
                  default: false
              required:
                - nombre
                - apellido
                - email
                - telefono
                - cantidadAbonos
                - unidadesAbono
                - boletoMovilLigado
                - aceptaAvisoPrivacidad
      responses:
        '201':
          description: Registro escrito y confirmado en el archivo independiente
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  stored:
                    type: boolean
                  submissionId:
                    type: string
                    format: uuid
        '400':
          description: Campos inválidos, cantidades/tallas inconsistentes o aviso no aceptado
        '409':
          description: El correo ya fue registrado en esta campaña
        '503':
          description: La captura de abonados está temporalmente deshabilitada

  /api/abonados-lmp-submissions.csv:
    get:
      summary: Descarga protegida del CSV independiente de abonados LMP 2026-2027
      security:
        - abonadosCsvExportToken: []
      responses:
        '200':
          description: Archivo CSV con registros de abonados
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Token ausente o incorrecto
        '503':
          description: Exportación deshabilitada porque ABONADOS_CSV_EXPORT_TOKEN no está configurado

  /api/softball-submit:
    post:
      summary: Registra una participación individual para el juego de sóftbol de afiliados
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nombreCompleto
                - telefono
                - eventoSeleccionado
                - aceptaAvisoPrivacidad
              properties:
                submissionId:
                  type: string
                  maxLength: 128
                nombreCompleto:
                  type: string
                  minLength: 5
                  maxLength: 140
                telefono:
                  type: string
                  description: Teléfono mexicano de 10 dígitos; se aceptan formatos con +52.
                eventoSeleccionado:
                  type: string
                  enum: [softbol-club-charros-2026-11-08]
                aceptaAvisoPrivacidad:
                  type: boolean
                  enum: [true]
                aceptaComunicaciones:
                  type: boolean
      responses:
        '200':
          description: Reintento idempotente de un envío previamente almacenado
        '201':
          description: Participación almacenada en el CSV independiente de sóftbol
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  stored:
                    type: boolean
                  submissionId:
                    type: string
        '400':
          description: Campos inválidos, evento incorrecto o aviso no aceptado
        '409':
          description: La persona ya fue registrada o el identificador pertenece a otro envío
        '410':
          description: La fecha límite de registro ya venció
        '503':
          description: El formulario de sóftbol está temporalmente deshabilitado

  /api/softball-submissions.csv:
    get:
      summary: Descarga protegida del CSV independiente de participantes de sóftbol
      security:
        - csvExportToken: []
      responses:
        '200':
          description: Archivo CSV con participaciones de sóftbol
          content:
            text/csv:
              schema:
                type: string
        '401':
          description: Token ausente o incorrecto
        '503':
          description: Exportación deshabilitada porque CSV_EXPORT_TOKEN no está configurado

components:
  securitySchemes:
    csvExportToken:
      type: http
      scheme: bearer
      bearerFormat: opaque token configured with CSV_EXPORT_TOKEN
    abonadosCsvExportToken:
      type: http
      scheme: bearer
      bearerFormat: opaque token configured with ABONADOS_CSV_EXPORT_TOKEN
