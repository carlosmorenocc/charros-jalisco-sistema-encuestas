name: CRM quality checks

on:
  pull_request:
    paths:
      - "crm-api/**"
      - "crm-import/**"
      - "crm-web/**"
      - "render.yaml"
      - ".github/workflows/crm-ci.yml"
  push:
    branches:
      - main
      - "feat/crm-abonados-lmp-26-27"
    paths:
      - "crm-api/**"
      - "crm-import/**"
      - "crm-web/**"
      - "render.yaml"
      - ".github/workflows/crm-ci.yml"

permissions:
  contents: read

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crm-api/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high

  importer:
    name: Importer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-import
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crm-import/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --check src/cli.js
      - run: node --check src/workbook.js
      - run: npm audit --audit-level=high

  web:
    name: Web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-web
    env:
      VITE_AUTH_MODE: local
      VITE_API_BASE_URL: /api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: crm-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
